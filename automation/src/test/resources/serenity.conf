serenity {
  project.name = "Account X QA Practice"
  # Etiqueta los escenarios fallidos como 'issue' en el reporte.
  tag.failures.with = "issue"
  # Toma capturas/detalles para todos los pasos en el reporte HTML.
  take.screenshots = FOR_FAILURES
}

# URL base del API bajo prueba.
# Por defecto apunta al mock local. En CI o en otro ambiente se sobreescribe
# con: -Drestapi.baseUrl=https://qa.accountx.com
restapi {
  baseUrl = "http://localhost:8080"
}

environments {
  local {
    restapi.baseUrl = "http://localhost:8080"
  }
  qa {
    restapi.baseUrl = "https://qa.accountx.example.com"
  }
}
